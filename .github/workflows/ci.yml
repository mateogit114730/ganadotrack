# Integración continua: en cada push o pull request se verifica que el código
# pase el análisis estático y todas las pruebas, y que el frontend compile.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ganadotrack
          POSTGRES_PASSWORD: ganadotrack
          POSTGRES_DB: ganadotrack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ganadotrack"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://ganadotrack:ganadotrack@localhost:5432/ganadotrack_test?schema=public
      JWT_SECRET: ci-secret
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
